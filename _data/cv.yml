          - "원자재 관련 뉴스 검색어 추출: ReAct 기반 Multi-Turn Agent로 검색 쿼리를 생성해 대상 기사 43~88% 검색, 키워드 포괄률 100% 달성"

    Projects:
      - name: 최적의 추천 값을 제안하는 자동화된 Prescriptive AI (부스트캠프 AI Tech 7기, 6인)
        start_date: 2024-08
        end_date: 2025-02
        summary: Tabular Data에서 목표값 Y를 달성하기 위한 입력값 X의 탐색을 자동화했습니다. X로부터 Y를 예측하는 Surrogate Model과 유전 알고리즘 기반 Search Model을 결합하고, 탐색 결과를 정규화하는 평가 지표를 설계했습니다.

      - name: Hand Bone Image Segmentation (부스트캠프 AI Tech 7기, 6인, 팀장)
        start_date: 2024-08
        end_date: 2025-02
        summary: X-Ray 이미지에서 손뼈 영역을 클래스별로 분류하는 Multi-Label Segmentation 프로젝트입니다. 이미지를 Crop 단위로 학습해 4개 클래스의 평균 Dice Score를 0.66%p 향상했습니다.

      - name: 재활용 품목 분류를 위한 Object Detection (부스트캠프 AI Tech 7기, 6인, 팀장)
        start_date: 2024-08
        end_date: 2025-02
        summary: 재활용 이미지에서 품목의 위치와 종류를 탐지하는 프로젝트입니다. Detectron2에 Contrastive Loss를 적용해 동일 클래스 내 형태 차이에도 일관된 특징을 학습하도록 개선, Baseline 대비 mAP50을 3.3%p 향상했습니다.

      - name: 로드뷰를 활용한 산책로 찾기 (개인 프로젝트)
        start_date: 2026-08
        end_date: 2026-08
        summary: GTX 1660 6GB 환경에서 vLLM으로 Gemma4 E2B를 서빙하며 VLM 모델의 병목을 파악해 처리량을 2.85배 향상했습니다. PLE embedding table을 CPU 메모리로 옮기고 UVA view를 적용했으며, 이미지 토큰 크기를 줄여 precision을 94.4%에서 92.7%로 낮추는 대신 처리량을 높였습니다.

    Publications:
      - title: Regularization Using Noise Samples Identified by the Feature Norm for Face Recognition
        authors:
          - Taeseong Gim
          - Kyung-Ah Sohn
        publisher: IEEE Access
        releaseDate: 2024
        url: https://ieeexplore.ieee.org/document/10662963/
        summary: 얼굴인식 데이터셋에서 클래스별 샘플 수가 많을수록 평균 Feature Norm이 커지는 현상을 발견하고, Feature Norm은 높지만 모델이 제대로 구별하지 못하는 샘플을 노이즈 후보로 정의했습니다. 이 샘플을 임베딩 공간에서 분리하는 정규화 항을 추가해 TinyFace Rank-1 성능을 1.1%, SurvFace FAR 0.01 기준 TPR을 3% 향상시켰습니다.

    Languages:
      - name: 영어
        summary: OPIc IH
